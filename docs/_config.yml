title: SharpInfer
description: Pure C# LLM inference engine — no Python, no bindings, no compromises.
baseurl: "/SharpInfer"
url: "https://jpaulduncan.github.io"

theme: just-the-docs

# Just the Docs configuration
color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

enable_copy_code_button: true

nav_sort: case_insensitive

# Aux links in the top-right
aux_links:
  "GitHub":
    - "https://github.com/jpaulduncan/SharpInfer"
aux_links_new_tab: true

# Footer
footer_content: "SharpInfer is MIT-licensed. Built with <a href=\"https://just-the-docs.com\">Just the Docs</a>."

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Heading anchor links
heading_anchors: true

# Callouts (note, warning, important, highlight)
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Collections (not used but good practice)
plugins:
  - jekyll-seo-tag

# Exclude from build

exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
  - "node_modules/"
  - "vendor/"
