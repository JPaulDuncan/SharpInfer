title: SharpInfer
description: Pure C# LLM inference engine — no Python, no bindings, no compromises.
theme: just-the-docs

url: ''
baseurl: '/SharpInfer'

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

aux_links:
  'GitHub':
    - 'https://github.com/jpaulduncan/SharpInfer'
aux_links_new_tab: true

footer_content: 'SharpInfer is MIT-licensed. Built with <a href=\"https://just-the-docs.com\">Just the Docs</a>..'

color_scheme: light

search_enabled: true
search.button: true

heading_anchors: true

back_to_top: true
back_to_top_text: 'Back to top'

nav_sort: case_insensitive

enable_copy_code_button: true

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

# Aux links in the top-right
aux_links:
  "GitHub":
    - "https://github.com/jpaulduncan/SharpInfer"
aux_links_new_tab: true

exclude:
  - Gemfile
  - Gemfile.lock
